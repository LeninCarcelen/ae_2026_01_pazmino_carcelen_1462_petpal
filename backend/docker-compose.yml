services:
  users-db:
    image: postgres:16-alpine
    container_name: users-db
    environment:
      POSTGRES_DB: ${POSTGRES_USERS_DB}
      POSTGRES_USER: ${POSTGRES_USERS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USERS_PASSWORD}
    volumes:
      - users_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERS_USER} -d ${POSTGRES_USERS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      postgres -c log_statement=all -c log_duration=on
               -c log_min_duration_statement=0 -c log_connections=on
               -c log_disconnections=on
               -c log_line_prefix='%m [%p] %q%u@%d '

  petpal-db:
    image: postgres:16-alpine
    container_name: petpal-db
    environment:
      POSTGRES_DB: ${POSTGRES_PETPAL_DB}
      POSTGRES_USER: ${POSTGRES_PETPAL_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PETPAL_PASSWORD}
    volumes:
      - petpal_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_PETPAL_USER} -d ${POSTGRES_PETPAL_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      postgres -c log_statement=all -c log_duration=on
               -c log_min_duration_statement=0 -c log_connections=on
               -c log_disconnections=on
               -c log_line_prefix='%m [%p] %q%u@%d '

  users:
    build: ./users
    container_name: users
    environment:
      DB_HOST: users-db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_USERS_DB}
      DB_USER: ${POSTGRES_USERS_USER}
      DB_PASSWORD: ${POSTGRES_USERS_PASSWORD}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
    expose:
      - "8081"
    depends_on:
      users-db:
        condition: service_healthy

  petpal:
    build: ./petpal
    container_name: petpal
    environment:
      DB_HOST: petpal-db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_PETPAL_DB}
      DB_USER: ${POSTGRES_PETPAL_USER}
      DB_PASSWORD: ${POSTGRES_PETPAL_PASSWORD}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      USERS_SERVICE_URL: http://users:8081
    expose:
      - "8080"
    depends_on:
      petpal-db:
        condition: service_healthy
      users:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "${GATEWAY_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
      - ./nginx/cors_headers.conf:/etc/nginx/cors_headers.conf:ro
    depends_on:
      users:
        condition: service_started
      petpal:
        condition: service_started

  db-explorer:
    image: dpage/pgadmin4:8
    container_name: db-explorer
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      users-db:
        condition: service_healthy
      petpal-db:
        condition: service_healthy

volumes:
  users_data:
  petpal_data:
