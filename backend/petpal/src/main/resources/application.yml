spring:
  application:
    name: petpal

  datasource:
    url: jdbc:postgresql://${DB_HOST:petpal-db}:${DB_PORT:5432}/${DB_NAME:petpal}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:petpal_user}
    password: ${DB_PASSWORD:petpal_pass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.petpal: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
