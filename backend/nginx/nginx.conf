user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    upstream users_service {
        server users:8081;
    }

    upstream petpal_service {
        server petpal:8080;
    }

    # Orígenes permitidos para llamadas del frontend (navegador) al gateway.
    # Agrega aquí la URL de producción del frontend cuando exista.
    map $http_origin $cors_origin {
        default "";
        "~^http://localhost:8100$" $http_origin;
        "~^http://localhost:4173$" $http_origin;
    }

    server {
        listen 80;

        # http://localhost:<GATEWAY_PORT>/users/api/users -> users:8081/api/users
        location /users/ {
            include /etc/nginx/cors_headers.conf;
            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://users_service/;
            include /etc/nginx/proxy_headers.conf;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # http://localhost:<GATEWAY_PORT>/petpal/api/owners -> petpal:8080/api/owners
        location /petpal/ {
            include /etc/nginx/cors_headers.conf;
            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://petpal_service/;
            include /etc/nginx/proxy_headers.conf;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
